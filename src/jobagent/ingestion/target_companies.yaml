# Liste d'entreprises cibles — Job Agent, session A2
#
# Usage : entrée du résolveur de slugs ATS (B1). Aucun slug n'est renseigné
# ici volontairement : les slugs se résolvent, ils ne se devinent pas.
#
# Champs :
#   name    : raison sociale usuelle
#   domain  : domaine principal, point d'entrée du résolveur
#   country : pays du siège (≠ lieu des postes)
#   note    : uniquement quand il y a un piège connu
#
# Après B2, ajouter par entreprise : ats_type, ats_slug, resolved_at,
# et un statut explicite (resolved | no_public_feed | dead | out_of_scope).
# Ne jamais supprimer une ligne non résolue : l'absence de feed est une
# information, et une ligne supprimée sera re-testée au prochain run.

